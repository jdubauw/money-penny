x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://ledger:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/ledger
  DATA_DIR: /data
  TZ: America/Chicago
  APP_USERNAME: ${APP_USERNAME:-admin}
  APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD to at least 12 characters}
  SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters}
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS application URL}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
services:
  web:
    build: .
    restart: unless-stopped
    environment: *app-environment
    expose:
      - "3005"
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - statements:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3005/health',timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - statements:/data
    depends_on:
      web:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  database:
  statements:
